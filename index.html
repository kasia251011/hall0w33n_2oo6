<html lang="pl">
<head>

<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* Layout: one narrow centered column on black, a lone photo, one line of text. Early-2000s riddle site, deliberately bare. */
:root {
  --bg: #000;
  --ink: #8d8a7f;
  --dim: #4a4840;
  --paper: #d9d4c4;
  --blood: #8e1b16;
  --line: #24231f;
  --serif: "Times New Roman", Times, "Liberation Serif", serif;
  --mono: "Courier New", Courier, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--serif); font-size: 17px; line-height: 1.5; padding-inline: 16px; padding-block: 36px 64px; }
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; transition: transform .6s ease-in-out; }
main.flip { transform: rotate(180deg); }
.lvl { font-family: var(--mono); font-size: 12px; letter-spacing: .2em; color: var(--dim); margin: 0; text-transform: lowercase; user-select: none; }
.frame { position: relative; width: 100%; line-height: 0; border: 1px solid var(--line); -webkit-touch-callout: none; }
.frame img { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none; }
.frame .lit { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.frame .lit.on { animation: candle 1s linear forwards; }
@keyframes candle { 0% { opacity: 0 } 8% { opacity: .9 } 14% { opacity: .55 } 22% { opacity: 1 } 70% { opacity: .92 } 78% { opacity: 1 } 90% { opacity: .4 } 100% { opacity: 0 } }
.frame.flicker > img { animation: flick 7s infinite steps(1); }
@keyframes flick { 0%,100% { opacity: 1 } 61% { opacity: .82 } 62% { opacity: 1 } 63% { opacity: .7 } 64% { opacity: 1 } }
.hot { position: absolute; background: transparent; border: 0; padding: 0; cursor: pointer; }
.hot:focus-visible { outline: 1px dotted var(--ink); }
.eye { position: absolute; width: 1.6%; aspect-ratio: 1; border-radius: 50%; background: #ff1a0a; box-shadow: 0 0 6px 3px #b3100a; transform: translate(-50%, -50%); pointer-events: none; animation: eye 1.8s forwards; }
@keyframes eye { 0%,100% { opacity: 0 } 15%,70% { opacity: 1 } 40% { transform: translate(-30%, -50%) } }
.riddle { margin: 0; font-style: italic; font-size: 19px; color: var(--ink); max-width: 44ch; }
form { display: flex; gap: 8px; justify-content: center; width: 100%; max-width: 300px; }
input { flex: 1; min-width: 0; background: var(--bg); color: var(--paper); border: 0; border-bottom: 1px solid var(--dim); font: inherit; font-size: 18px; padding: 4px 2px; text-align: center; border-radius: 0; }
input:focus { outline: none; border-bottom-color: var(--ink); }
input::placeholder { color: var(--dim); font-style: italic; opacity: 1; }
button.go, button.link { background: none; border: 0; color: var(--ink); font: inherit; cursor: pointer; padding: 4px 6px; }
button.go:hover, button.link:hover { color: var(--paper); }
button.go:focus-visible, button.link:focus-visible, #sound:focus-visible { outline: 1px dotted var(--ink); }
.msg { min-height: 1.5em; margin: 0; color: var(--blood); font-style: italic; max-width: 44ch; }
.msg.warm { color: #b5651d; }
.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: none } 20% { transform: translateX(-6px) } 40% { transform: translateX(5px) } 60% { transform: translateX(-3px) } 80% { transform: translateX(2px) } }
.whisper { margin: 0; font-size: 15px; color: var(--dim); font-style: italic; max-width: 44ch; }
.whisper button { color: var(--dim); font-size: 14px; text-decoration: underline dotted; text-underline-offset: 3px; }
.letter { width: 100%; text-align: left; color: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 22px; animation: rise 1.6s ease-out; }
.letter h2 { font-weight: normal; font-family: var(--mono); font-size: 12px; letter-spacing: .25em; color: var(--dim); margin: 0 0 14px; text-transform: lowercase; }
.letter p { margin: 0 0 12px; max-width: 62ch; }
.letter p:last-child { margin-bottom: 0; }
.letter b { font-weight: normal; color: var(--bg); background: var(--paper); padding: 0 4px; }
@keyframes rise { from { opacity: .15; filter: blur(2px) } to { opacity: 1; filter: none } }
.archive { width: 100%; text-align: left; color: var(--dim); font-size: 15px; }
.archive summary { cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-align: center; list-style: none; }
.archive summary::-webkit-details-marker { display: none; }
.archive .letter { animation: none; }
.end { margin: 0; font-style: italic; color: var(--blood); }
#sound { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 10px; background: none; border: 0; color: var(--dim); font-family: var(--mono); font-size: 13px; cursor: pointer; padding: 6px 8px; }
#sound[aria-pressed="false"] { text-decoration: line-through; }
#idle { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); margin: 0; text-align: center; font-style: italic; color: var(--blood); pointer-events: none; transition: opacity 1.5s; opacity: 0; }
#idle.on { opacity: 1; }
#blood { position: fixed; inset: 0; background: var(--blood); mix-blend-mode: multiply; opacity: 0; pointer-events: none; transition: opacity .15s; }
#blood.on { opacity: .85; }
@media (prefers-reduced-motion: reduce) { .frame.flicker > img, .shake, .letter, main { animation: none; transition: none; } }
</style>
</head>

  "próbuj dalej. mamy całą noc.", "ktoś za tobą parsknął śmiechem.", "to było… odważne."];
const WARM = ["ciepło… jak na ciebie.", "ciepło. tylko się nie ekscytuj.", "letnio. jak herbata, o której ktoś zapomniał."];
const HOT = ["coś tu świszczy… może wiatr. a może ty.", "coś tu świszczy… prawie. a prawie robi wielką różnicę.",
  "uuu, gorąco. szkoda, że gorąco to nie to samo co dobrze."];
const EGGS = {
  pomocy: "nikt cię nie usłyszy.", ratunku: "nikt cię nie usłyszy.", help: "nikt cię nie usłyszy.",
  haslo: "bardzo śmieszne.", notpron: "to nie ten dom. ale pozdrów Davida.",
  psikus: "psikus.", cukierek: "cukierki skończyły się w 2004.", "666": "nie mów tego na głos.",
  bu: "aaa! …nie. i tak mnie nie przestraszysz.", buu: "aaa! …nie. i tak mnie nie przestraszysz.",
  buuu: "aaa! …nie. i tak mnie nie przestraszysz.", boo: "aaa! …nie. i tak mnie nie przestraszysz.",
  kasia: "ona już wie, że tu jesteś.", tomek: "on stoi tuż za tobą.",
};
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- crypto: level content is encrypted with its answer ---------- */
const KEY = "mypron.v2";
const te = new TextEncoder(), td = new TextDecoder();
const sha = async b => new Uint8Array(await crypto.subtle.digest("SHA-256", b));
const cat = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
const norm = s => s.toLowerCase().replace(/\u0142/g, "l").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
const tagOf = async s => hex(await sha(te.encode(s))).slice(0, 16);
async function derive(ans) { let k = te.encode("my-pron:" + ans); for (let i = 0; i < 2000; i++) k = await sha(k); return k; }
async function stream(k, n) {
  const out = new Uint8Array(n);
  for (let i = 0, off = 0; off < n; i++, off += 32) {
    const blk = await sha(cat(k, new Uint8Array([i >>> 24, (i >>> 16) & 255, (i >>> 8) & 255, i & 255])));
    out.set(blk.subarray(0, Math.min(32, n - off)), off);
  }
  return out;
}
const xor = (a, b) => a.map((x, i) => x ^ b[i]);
async function unlock(step, ans) {
  const box = LOCKS[step], k = await derive(norm(ans));
  const tag = hex(await sha(cat(k, te.encode("ok")))).slice(0, 16);
  const lock = box.locks.find(l => l.tag === tag);
  if (!lock) return null;
  const w = b64(lock.w), K = xor(w, await stream(k, w.length));
  const d = b64(box.data);
  return JSON.parse(td.decode(xor(d, await stream(K, d.length))));
}
async function closeness(L, n) {
  if (!L.near) return 0;
  const t = L.near[await tagOf("near:" + n)];
  if (t) return t;
  if (L.anag && L.anag === await tagOf("anag:" + [...n].sort().join(""))) return 2;
  return 0;
}

/* ---------- sound: generated live, no files ---------- */
const Snd = (() => {
  let ctx = null, master = null, on = true, boxTimer = null;
  try { on = localStorage.getItem("mypron.sound") !== "off"; } catch (e) {}
  const noiseBuf = () => {
    const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  };
  const env = (g, t, peak, a, dec) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); };
  let echo;
  function ambient() {
    const t = ctx.currentTime;
    // drone: two beating low sines and a sour third voice
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 380;
    const dg = ctx.createGain(); dg.gain.value = 0; dg.gain.linearRampToValueAtTime(0.09, t + 6);
    [[55, "sine"], [55.6, "sine"], [77.8, "triangle"]].forEach(([f, type]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.connect(lp); o.start();
    });
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 0.03;
    lfo.connect(lg).connect(dg.gain); lfo.start();
    lp.connect(dg).connect(master);
    // wind
    const n = ctx.createBufferSource(); n.buffer = noiseBuf(); n.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 420; bp.Q.value = 1.2;
    const wl = ctx.createOscillator(), wg = ctx.createGain(); wl.frequency.value = 0.05; wg.gain.value = 260;
    wl.connect(wg).connect(bp.frequency); wl.start();
    const ng = ctx.createGain(); ng.gain.value = 0; ng.gain.linearRampToValueAtTime(0.035, t + 8);
    n.connect(bp).connect(ng).connect(master); n.start();
    // echo for the music box
    echo = ctx.createDelay(); echo.delayTime.value = 0.33;
    const fb = ctx.createGain(); fb.gain.value = 0.35; echo.connect(fb).connect(echo); echo.connect(master);
  }
  const SCALE = [440, 493.88, 523.25, 622.25, 659.25, 698.46, 880];
  function note(f, t) {
    const g = ctx.createGain();
    [[1, 1], [2, 0.3]].forEach(([m, v]) => {
      const o = ctx.createOscillator(), og = ctx.createGain(); o.type = "sine";
      o.frequency.value = f * m * (1 + (Math.random() - 0.5) * 0.025); og.gain.value = v;
      o.connect(og).connect(g); o.start(t); o.stop(t + 2.2);
    });
    env(g, t, 0.045, 0.005, 1.9); g.connect(master); g.connect(echo);
  }
  function musicBox() {
    if (on) { const t = ctx.currentTime + 0.05, k = 1 + Math.floor(Math.random() * 3); for (let i = 0; i < k; i++) note(pick(SCALE), t + i * (0.32 + Math.random() * 0.2)); }
    boxTimer = setTimeout(musicBox, 3500 + Math.random() * 5000);
  }
  function noise(t, dur, type, f0, f1, peak) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuf();
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = 1.5;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); env(g, t, peak, 0.02, dur); n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + dur + 0.1);
  }
  const fx = {
    creak() {
      const t = ctx.currentTime, o = ctx.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(85, t); o.frequency.linearRampToValueAtTime(150, t + 1.4);
      const wob = ctx.createOscillator(), wg = ctx.createGain(); wob.frequency.value = 23; wg.gain.value = 35; wob.connect(wg).connect(o.frequency);
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 650; bp.Q.value = 3;
      const g = ctx.createGain(); env(g, t, 0.16, 0.12, 1.4);
      o.connect(bp).connect(g).connect(master); o.start(t); wob.start(t); o.stop(t + 1.7); wob.stop(t + 1.7);
    },
    thud() {
      const t = ctx.currentTime, o = ctx.createOscillator(); o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(32, t + 0.3);
      const g = ctx.createGain(); env(g, t, 0.4, 0.005, 0.4); o.connect(g).connect(master); o.start(t); o.stop(t + 0.5);
    },
    whoosh() { noise(ctx.currentTime, 1.1, "bandpass", 300, 2200, 0.18); },
    spark() {
      // lighter: flint wheel scrape followed by a few crackling sparks
      const t = ctx.currentTime;
      noise(t, 0.06, "highpass", 3500, 2500, 0.3);
      const k = 3 + Math.floor(Math.random() * 4);
      for (let i = 0; i < k; i++) noise(t + 0.03 + Math.random() * 0.16, 0.012 + Math.random() * 0.015, "bandpass", 3000 + Math.random() * 3000, 2500, 0.22);
    },
    strike() { const t = ctx.currentTime; fx.spark(); noise(t + 0.09, 0.9, "lowpass", 700, 300, 0.12); },
    sting() {
      const t = ctx.currentTime;
      [110, 116.54, 155.56, 233.08].forEach(f => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; env(g, t, 0.06, 0.4, 3); o.connect(g).connect(master); o.start(t); o.stop(t + 3.6); });
    },
  };
  function start() {
    if (ctx || !on) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination); ambient();
  }
  return {
    start,
    play(name) { if (ctx && on) { try { fx[name](); } catch (e) {} } },
    toggle() {
      on = !on; try { localStorage.setItem("mypron.sound", on ? "on" : "off"); } catch (e) {}
      if (on) { start(); if (ctx) { ctx.resume(); master.gain.value = 0.8; } } else if (ctx) { master.gain.value = 0; }
      return on;
    },
    get on() { return on; },
  };
})();
const soundBtn = document.getElementById("sound");
soundBtn.setAttribute("aria-pressed", String(Snd.on));
soundBtn.addEventListener("click", e => { e.stopPropagation(); soundBtn.setAttribute("aria-pressed", String(Snd.toggle())); });
document.addEventListener("pointerdown", e => { if (e.target !== soundBtn) Snd.start(); }, true);
document.addEventListener("keydown", () => Snd.start(), true);

/* ---------- small global haunts ---------- */
const baseTitle = document.title;
document.addEventListener("visibilitychange", () => { document.title = document.hidden ? "wróć…" : baseTitle; });
const idleEl = document.getElementById("idle");
let idleT;
const poke = () => { idleEl.classList.remove("on"); clearTimeout(idleT); idleT = setTimeout(() => idleEl.classList.add("on"), 120000); };
["pointerdown", "pointermove", "keydown", "scroll", "touchstart"].forEach(ev => addEventListener(ev, poke, { passive: true }));
poke();
const bloodEl = document.getElementById("blood");

/* ---------- game ---------- */
let solved = [];
try { solved = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(solved)); } catch (e) {} };

const app = document.getElementById("app");
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
let timers = [];
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const letters = [];
function letterEl(r) { const d = el("div", "letter"); d.append(el("h2", null, r.title)); d.insertAdjacentHTML("beforeend", r.html); return d; }
function archive(list, label) {
  const d = el("details", "archive");
  d.append(el("summary", null, `${label} (${list.length})`));
  list.forEach(l => d.append(letterEl(l)));
  return d;
}
const inRect = (x, y, [l, t, w, h]) => x >= l && x <= l + w && y >= t && y <= t + h;

function showLevel(L, step) {
  clearTimers(); app.replaceChildren(); window.scrollTo(0, 0);
  const lvl = el("p", "lvl", L.lvl); app.append(lvl);
  const frame = el("div", "frame" + (L.flicker ? " flicker" : ""));
  const img = el("img"); img.src = L.img; img.alt = "zdjęcie"; img.draggable = false;
  frame.append(img); app.append(frame);
  app.append(el("p", "riddle", L.riddle));
  const msg = el("p", "msg");
  let busy = false, wrongs = 0, last = null, lvlClicks = 0, keyholeClicks = 0, lights = 0;

  const say = (text, cls, sound) => {
    msg.textContent = text; msg.className = "msg" + (cls ? " " + cls : "");
    void msg.offsetWidth; msg.classList.add("shake");
    if (sound) Snd.play(sound);
  };
  const egg = (n) => {
    if (n === "psikus" && !matchMedia("(prefers-reduced-motion: reduce)").matches) { app.classList.add("flip"); setTimeout(() => app.classList.remove("flip"), 2000); }
    if (n === "666") { bloodEl.classList.add("on"); Snd.play("thud"); setTimeout(() => bloodEl.classList.remove("on"), 700); }
    say(EGGS[n]);
  };
  const solve = async (ans) => {
    const res = await unlock(step, ans);
    if (!res) return false;
    solved.push(ans); save(); showReward(res, true); return true;
  };
  const attempt = async (raw) => {
    if (busy) return; busy = true;
    try {
      const n = norm(raw);
      if (await solve(raw)) return;
      if (n === last) return say("to samo? naprawdę?", null, "thud");
      last = n;
      const c = await closeness(L, n);
      if (typeof c === "string") return say(c, "warm", "whoosh");
      if (c === 2) return say(pick(HOT), "warm", "whoosh");
      if (c === 1) return say(pick(WARM), "warm");
      if (EGGS[n]) return egg(n);
      say(WRONG[wrongs++ % WRONG.length], null, "thud");
    } finally { busy = false; }
  };

  lvl.addEventListener("click", () => { if (++lvlClicks === 5) say("nie ma skrótów. no, prawie."); });
  img.addEventListener("contextmenu", e => { e.preventDefault(); say("nie zabieraj mi zdjęć."); });

  // clickable spots inside the photo
  (L.hots || []).forEach(h => {
    if (!h.answer && !h.light) return;
    const b = el("button", "hot"); b.type = "button"; b.setAttribute("aria-label", h.label || "");
    Object.assign(b.style, { left: h.r[0] + "%", top: h.r[1] + "%", width: h.r[2] + "%", height: h.r[3] + "%" });
    if (h.answer) b.addEventListener("click", e => { e.stopPropagation(); Snd.play("creak"); attempt(h.answer); });
    if (h.light) {
      const lit = el("img", "lit"); lit.src = L.imgLit; lit.alt = ""; frame.append(lit);
      b.addEventListener("click", e => {
        e.stopPropagation();
        if (lit.classList.contains("on")) return;
        lights++; Snd.play("strike");
        lit.classList.add("on"); setTimeout(() => lit.classList.remove("on"), 1000);
        if (lights === 7) say("zapałki się kiedyś skończą.");
      });
    }
    frame.append(b);
  });
  frame.addEventListener("click", e => {
    const r = frame.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
    const h = (L.hots || []).find(h => !h.answer && !h.light && inRect(x, y, h.r));
    if (h && h.egg === "keyhole") {
      keyholeClicks++;
      say(keyholeClicks >= 3 ? "…" : pick(["ktoś patrzy z drugiej strony.", "ciii. nie ruszaj się."]));
      if (keyholeClicks >= 3) { const eye = el("span", "eye"); eye.style.left = "70.6%"; eye.style.top = "61.5%"; frame.append(eye); setTimeout(() => eye.remove(), 1900); keyholeClicks = 0; }
      return;
    }
    if (L.imgLit) Snd.play("spark");
    if (h) return say(pick(h.say));
    if (L.miss) say(pick(L.miss));
  });

  if (L.kind !== "click") {
    const f = el("form"); f.autocomplete = "off";
    const inp = el("input"); inp.id = "answer-" + step; inp.setAttribute("aria-label", "odpowiedź"); inp.spellcheck = false; inp.placeholder = "szepnij odpowiedź…"; inp.autocapitalize = "off";
    const b = el("button", "go", "→"); b.type = "submit"; b.setAttribute("aria-label", "sprawdź");
    f.append(inp, b);
    f.addEventListener("submit", e => { e.preventDefault(); if (norm(inp.value)) attempt(inp.value); });
    app.append(f);
  }
  app.append(msg);
  const w = el("p", "whisper"); app.append(w);
  (L.hints || []).forEach(([sec, text], i) => timers.push(setTimeout(() => {
    w.replaceChildren();
    const b = el("button", "link", i ? "jeszcze jeden szept" : "szept zza grobu");
    b.addEventListener("click", () => { w.textContent = text; });
    w.append(b);
  }, sec * 1000)));
  if (letters.length) app.append(archive(letters, "listy"));
}

function showReward(res, fresh) {
  clearTimers(); app.replaceChildren(); window.scrollTo(0, 0);
  letters.push(res.reward);
  if (fresh) Snd.play("sting");
  const prev = letters.slice(0, -1);
  if (!res.next) {
    app.append(el("p", "lvl", "wszystkie listy"));
    prev.forEach(l => { const e = letterEl(l); e.style.animation = "none"; app.append(e); });
  } else if (prev.length) app.append(archive(prev, "wcześniejsze listy"));
  const l = letterEl(res.reward); if (!fresh) l.style.animation = "none"; app.append(l);
  if (res.next) {
    const b = el("button", "go", "dalej →");
    b.addEventListener("click", () => showLevel(res.next, letters.length));
    app.append(b);
  } else {
    app.append(el("p", "end", "koniec. drzwi są już otwarte."));
  }
}

(async function boot() {
  let res = null;
  for (let i = 0; i < solved.length && i < LOCKS.length; i++) {
    const r = await unlock(i, solved[i]);
    if (!r) { solved = solved.slice(0, i); save(); break; }
    res = r; letters.push(r.reward);
  }
  if (!res) return showLevel(L1, 0);
  letters.pop();
  showReward(res, false);
})();
</script>
