<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>my-pron</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* Layout: one narrow centered column on black, a lone photo, one line of text. Early-2000s riddle site, deliberately bare. */
:root {
  --bg: #000;
  --ink: #8d8a7f;
  --dim: #4a4840;
  --paper: #d9d4c4;
  --blood: #8e1b16;
  --line: #24231f;
  --serif: "Times New Roman", Times, "Liberation Serif", serif;
  --mono: "Courier New", Courier, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--serif); font-size: 17px; line-height: 1.5; padding-inline: 16px; padding-block: 36px 64px; }
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.lvl { font-family: var(--mono); font-size: 12px; letter-spacing: .2em; color: var(--dim); margin: 0; text-transform: lowercase; }
.frame { position: relative; width: 100%; line-height: 0; border: 1px solid var(--line); }
.frame img { width: 100%; height: auto; display: block; }
.frame.flicker img { animation: flick 7s infinite steps(1); }
@keyframes flick { 0%,100% { opacity: 1 } 61% { opacity: .82 } 62% { opacity: 1 } 63% { opacity: .7 } 64% { opacity: 1 } }
#handle { position: absolute; left: 59%; top: 33.5%; width: 16.5%; height: 41%; background: transparent; border: 0; padding: 0; cursor: pointer; }
#handle:focus-visible { outline: 1px dotted var(--ink); }
.riddle { margin: 0; font-style: italic; font-size: 19px; color: var(--ink); max-width: 44ch; }
form { display: flex; gap: 8px; justify-content: center; width: 100%; max-width: 300px; }
input { flex: 1; min-width: 0; background: var(--bg); color: var(--paper); border: 0; border-bottom: 1px solid var(--dim); font: inherit; font-size: 18px; padding: 4px 2px; text-align: center; border-radius: 0; }
input:focus { outline: none; border-bottom-color: var(--ink); }
button.go, button.link { background: none; border: 0; color: var(--ink); font: inherit; cursor: pointer; padding: 4px 6px; }
button.go:hover, button.link:hover { color: var(--paper); }
button.go:focus-visible, button.link:focus-visible { outline: 1px dotted var(--ink); }
.msg { min-height: 1.5em; margin: 0; color: var(--blood); font-style: italic; }
.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: none } 20% { transform: translateX(-6px) } 40% { transform: translateX(5px) } 60% { transform: translateX(-3px) } 80% { transform: translateX(2px) } }
.whisper { margin: 0; font-size: 15px; color: var(--dim); font-style: italic; max-width: 44ch; }
.whisper button { color: var(--dim); font-size: 14px; text-decoration: underline dotted; text-underline-offset: 3px; }
.letter { width: 100%; text-align: left; color: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 22px; animation: rise 1.6s ease-out; }
.letter h2 { font-weight: normal; font-family: var(--mono); font-size: 12px; letter-spacing: .25em; color: var(--dim); margin: 0 0 14px; text-transform: lowercase; }
.letter p { margin: 0 0 12px; max-width: 62ch; }
.letter p:last-child { margin-bottom: 0; }
.letter b { font-weight: normal; color: var(--bg); background: var(--paper); padding: 0 4px; }
@keyframes rise { from { opacity: .15; filter: blur(2px) } to { opacity: 1; filter: none } }
.archive { width: 100%; text-align: left; color: var(--dim); font-size: 15px; }
.archive summary { cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-align: center; list-style: none; }
.archive summary::-webkit-details-marker { display: none; }
.archive .letter { animation: none; }
.end { margin: 0; font-style: italic; color: var(--blood); }
@media (prefers-reduced-motion: reduce) { .frame.flicker img, .shake, .letter { animation: none; } }
</style>
</head>

const WRONG = ["nie.", "zimno.", "coś skrzypi, ale to nie to.", "nie tędy.", "słyszysz ten śmiech?", "ktoś za tobą stoi. to też nie to."];
const KEY = "mypron.v1";

const te = new TextEncoder(), td = new TextDecoder();
const sha = async b => new Uint8Array(await crypto.subtle.digest("SHA-256", b));
const cat = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
const norm = s => s.toLowerCase().replace(/\u0142/g, "l").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
async function derive(ans) { let k = te.encode("my-pron:" + ans); for (let i = 0; i < 2000; i++) k = await sha(k); return k; }
async function stream(k, n) {
  const out = new Uint8Array(n);
  for (let i = 0, off = 0; off < n; i++, off += 32) {
    const blk = await sha(cat(k, new Uint8Array([i >>> 24, (i >>> 16) & 255, (i >>> 8) & 255, i & 255])));
    out.set(blk.subarray(0, Math.min(32, n - off)), off);
  }
  return out;
}
const xor = (a, b) => a.map((x, i) => x ^ b[i]);
async function unlock(step, ans) {
  const box = LOCKS[step], k = await derive(norm(ans));
  const tag = hex(await sha(cat(k, te.encode("ok")))).slice(0, 16);
  const lock = box.locks.find(l => l.tag === tag);
  if (!lock) return null;
  const w = b64(lock.w), K = xor(w, await stream(k, w.length));
  const d = b64(box.data);
  return JSON.parse(td.decode(xor(d, await stream(K, d.length))));
}

let solved = [];
try { solved = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(solved)); } catch (e) {} };

const app = document.getElementById("app");
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
let timers = [];
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const letters = [];

function archive() {
  if (!letters.length) return null;
  const d = el("details", "archive");
  d.append(el("summary", null, `listy (${letters.length})`));
  letters.forEach(l => d.append(letterEl(l)));
  return d;
}
function letterEl(r) { const d = el("div", "letter"); d.append(el("h2", null, r.title)); d.insertAdjacentHTML("beforeend", r.html); return d; }

function showLevel(L, step) {
  clearTimers(); app.replaceChildren(); window.scrollTo(0, 0);
  app.append(el("p", "lvl", L.lvl));
  const frame = el("div", "frame" + (L.flicker ? " flicker" : ""));
  const img = el("img"); img.src = L.img; img.alt = "zdjęcie"; img.draggable = true;
  frame.append(img); app.append(frame);
  app.append(el("p", "riddle", L.riddle));
  const msg = el("p", "msg");
  let busy = false, miss = 0;
  const fail = (text) => {
    msg.textContent = text || WRONG[miss++ % WRONG.length];
    msg.classList.remove("shake"); void msg.offsetWidth; msg.classList.add("shake");
  };
  const attempt = async (ans) => {
    if (busy) return; busy = true;
    try {
      const res = await unlock(step, ans);
      if (!res) { fail(); return; }
      solved.push(ans); save(); showReward(res, true);
    } finally { busy = false; }
  };
  if (L.click) {
    const h = el("button"); h.id = "handle"; h.setAttribute("aria-label", "klamka");
    h.addEventListener("click", e => { e.stopPropagation(); attempt("klamka"); });
    frame.append(h);
    img.addEventListener("click", () => fail(["nie tam.", "pukanie nic nie da.", "zimno."][miss++ % 3]));
  } else {
    const f = el("form"); f.autocomplete = "off";
    const inp = el("input"); inp.id = "answer-" + step; inp.setAttribute("aria-label", "odpowiedź"); inp.spellcheck = false; inp.autocapitalize = "off";
    const b = el("button", "go", "→"); b.type = "submit"; b.setAttribute("aria-label", "sprawdź");
    f.append(inp, b);
    f.addEventListener("submit", e => { e.preventDefault(); if (norm(inp.value)) attempt(inp.value); });
    app.append(f);
  }
  app.append(msg);
  const w = el("p", "whisper"); app.append(w);
  (L.hints || []).forEach(([sec, text], i) => timers.push(setTimeout(() => {
    w.replaceChildren();
    const b = el("button", "link", i ? "jeszcze jeden szept" : "szept zza grobu");
    b.addEventListener("click", () => { w.textContent = text; });
    w.append(b);
  }, sec * 1000)));
  const a = archive(); if (a) app.append(a);
}

let current = null;
function showReward(res, fresh) {
  clearTimers(); app.replaceChildren(); window.scrollTo(0, 0);
  letters.push(res.reward); current = res;
  const prev = letters.slice(0, -1);
  if (!res.next) {
    app.append(el("p", "lvl", "wszystkie listy"));
    prev.forEach(l => { const e = letterEl(l); e.style.animation = "none"; app.append(e); });
  } else if (prev.length) { const d = el("details", "archive"); d.append(el("summary", null, `wcześniejsze listy (${prev.length})`)); prev.forEach(l => d.append(letterEl(l))); app.append(d); }
  const l = letterEl(res.reward); if (!fresh) l.style.animation = "none"; app.append(l);
  if (res.next) {
    const b = el("button", "go", "dalej →");
    b.addEventListener("click", () => showLevel(res.next, letters.length));
    app.append(b);
  } else {
    app.append(el("p", "end", "koniec. drzwi są już otwarte."));
  }
}

(async function boot() {
  let res = null;
  for (let i = 0; i < solved.length && i < LOCKS.length; i++) {
    const r = await unlock(i, solved[i]);
    if (!r) { solved = solved.slice(0, i); save(); break; }
    res = r; letters.push(r.reward);
  }
  if (!res) return showLevel(L1, 0);
  letters.pop();
  showReward(res, false);
})();
